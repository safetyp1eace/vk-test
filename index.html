    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0f1016; color: #fff; margin: 0; padding: 12px; }
        .info-bar { background: #1a1b26; border-radius: 12px; padding: 10px 14px; margin-bottom: 12px; font-size: 14px; display: flex; justify-content: space-between; border: 1px solid #2f334d; color: #38bdf8; font-weight: bold; }
        .card { background: #1a1b26; border-radius: 14px; padding: 16px; margin-bottom: 12px; border: 1px solid #2f334d; }
        .card.active { border: 2px solid #22c55e; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .lesson-num { color: #38bdf8; font-weight: bold; font-size: 15px; }
        .cabinet { background: #2f334d; padding: 4px 10px; border-radius: 8px; font-size: 13px; font-weight: bold; }
        .subject { font-size: 18px; font-weight: bold; margin-bottom: 6px; }
        .teacher { color: #94a3b8; font-size: 14px; margin-bottom: 10px; }
        .footer { display: flex; justify-content: space-between; font-size: 13px; color: #94a3b8; border-top: 1px solid #2f334d; padding-top: 8px; }
        .time { color: #f8fafc; font-weight: 500; }
        .status { color: #22c55e; font-weight: bold; }
        .vk-container { margin-top: 20px; border-radius: 14px; overflow: hidden; background: #1a1b26; padding: 10px; border: 1px solid #2f334d; }
        h3 { text-align: center; color: #94a3b8; font-size: 16px; margin-top: 5px; margin-bottom: 15px; }
    </style>
</head>
<body>

    <!-- Блок с виджетом ВК -->

        <h3>Замены из ВК 👇</h3>
        <div id="vk_groups"></div>
    </div>

    // Полное расписание

            ],

                {time: "10:10 - 11:40", num: "Пара 2", subject: "Математика", teacher: "Дайбов В.А."},
                {time: "12:00 - 13:30", num: "Пара 3", subject: "Физическая культура", teacher: "Моисеенко В.М. Никифоров О.Н."},

            ],

                {time: "12:00 - 13:30", num: "Пара 3", subject: "Иностранный язык", teacher: "Налётова Н.И. Минаев П.В."},
                {time: "13:50 - 15:20", num: "Пара 4", subject: "Основы безопасности", teacher: "Родина/Созинов Э.Б."}
            ],
            4: [],
            5: [
                {time: "10:10 - 11:40", num: "Пара 2", subject: "Математика", teacher: "Дайбов В.А."},
                {time: "12:00 - 13:30", num: "Пара 3", subject: "Математика", teacher: "Дайбов В.А."},
                {time: "13:50 - 15:20", num: "Пара 4", subject: "История", teacher: "Волошко Р.А."},
                {time: "15:40 - 17:10", num: "Пара 5", subject: "Биология", teacher: "Козлова М.М."}
            ],
            6: [
                {time: "08:30 - 10:00", num: "Пара 1", subject: "Русский язык", teacher: "Багирова З.П."},
                {time: "10:10 - 11:40", num: "Пара 2", subject: "Литература", teacher: "Багирова З.П."}
            ]
        },
        2: {
            1: [
                {time: "08:30 - 10:00", num: "Пара 1", subject: "История", teacher: "Волошко Р.А."},
                {time: "10:10 - 11:40", num: "Пара 2", subject: "Русский язык", teacher: "Багирова З.П."},
                {time: "12:00 - 13:30", num: "Пара 3", subject: "Физика", teacher: "Кноп Т.И."},
                {time: "13:50 - 15:20", num: "Пара 4", subject: "Информатика", teacher: "Дергачев А.И. Анненко Е.С."}
            ],
            2: [
                {time: "08:30 - 10:00", num: "Пара 1", subject: "Обществознание", teacher: "Богаченко А.А."},
                {time: "10:10 - 11:40", num: "Пара 2", subject: "Математика", teacher: "Дайбов В.А."},
                {time: "12:00 - 13:30", num: "Пара 3", subject: "Физическая культура", teacher: "Моисеенко В.М. Никифоров О.Н."},
                {time: "13:50 - 15:20", num: "Пара 4", subject: "Физика (вх)", teacher: "Кноп Т.И. Демидова М.А."}
            ],
            3: [
                {time: "10:10 - 11:40", num: "Пара 2", subject: "Химия", teacher: "Могильная П.Г."},
                {time: "12:00 - 13:30", num: "Пара 3", subject: "Литература", teacher: "Багирова З.П."},
                {time: "13:50 - 15:20", num: "Пара 4", subject: "Биология", teacher: "Козлова М.М."}
            ],
            4: [],
            5: [
                {time: "08:30 - 10:00", num: "Пара 1", subject: "Иностранный язык", teacher: "Налётова Н.И. Минаев П.В."},
                {time: "10:10 - 11:40", num: "Пара 2", subject: "Математика", teacher: "Дайбов В.А."},
                {time: "12:00 - 13:30", num: "Пара 3", subject: "Математика", teacher: "Дайбов В.А."},
                {time: "13:50 - 15:20", num: "Пара 4", subject: "Основы безопасности", teacher: "Родина/Созинов Э.Б."}
            ],
            6: [
                {time: "10:10 - 11:40", num: "Пара 2", subject: "История", teacher: "Волошко Р.А."},
                {time: "12:00 - 13:30", num: "Пара 3", subject: "Литература", teacher: "Багирова З.П."},
                {time: "13:50 - 15:20", num: "Пара 4", subject: "Информатика", teacher: "Дергачев А.И. Анненко Е.С."}
            ]
        }
    };

    function render() {
        const now = new Date();
        let day = now.getDay();
        let currentWeek = 2; // Жестко ставим неделю 2

        const daysNames = ["Воскресенье", "Понедельник", "Вторник", "Среда", "Четверг", "Пятница", "Суббота"];
        document.getElementById("infoBar").innerHTML = `<span>${daysNames[day]}</span> <span>Неделя ${currentWeek}</span>`;

        const container = document.getElementById("scheduleContainer");
        container.innerHTML = "";

        if (day === 0 || !scheduleData[currentWeek][day] || scheduleData[currentWeek][day].length === 0) {
            container.innerHTML = '<div class="card"><div class="subject">Пар нет! Отдыхаем 🎉</div></div>';
            return;
        }

        const lessons = scheduleData[currentWeek][day];
        const currentTimeMinutes = now.getHours() * 60 + now.getMinutes();

        lessons.forEach(l => {
            // Берем кабинет из словаря по преподу
            let cab = teacherCabinets[l.teacher] || "—";

            let [startStr, endStr] = l.time.split(" - ");
            let [sH, sM] = startStr.split(":").map(Number);
            let [eH, eM] = endStr.split(":").map(Number);
            let startMin = sH * 60 + sM;
            let endMin = eH * 60 + eM;

            let statusText = "Ожидается";
            let statusColor = "#94a3b8";
            let isActive = false;

            if (currentTimeMinutes >= startMin && currentTimeMinutes <= endMin) {
                isActive = true;
                let left = endMin - currentTimeMinutes;
                let h = Math.floor(left / 60);
                let m = left % 60;
                statusText = `До конца: ${(h > 0 ? h + " ч. " : "") + m + " мин."}`;
                statusColor = "#22c55e";
            } else if (currentTimeMinutes > endMin) {
                statusText = "Завершена";
                statusColor = "#64748b";
            } else {
                let left = startMin - currentTimeMinutes;
                let h = Math.floor(left / 60);
                let m = left % 60;
                statusText = `До начала: ${(h > 0 ? h + " ч. " : "") + m + " мин."}`;
                statusColor = "#f59e0b";
            }

            container.innerHTML += `
                <div class="card ${isActive ? 'active' : ''}">
                    <div class="header">
                        <span class="lesson-num">${l.num}</span>
                        <span class="cabinet">Каб. ${cab}</span>
                    </div>
                    <div class="subject">${l.subject}</div>
                    <div class="teacher">${l.teacher}</div>
                    <div class="footer">
                        <span class="time">${l.time}</span>
                        <span class="status" style="color: ${statusColor};">${statusText}</span>
                    </div>
                </div>
            `;
        });
    }

    render();
    setInterval(render, 60000); // Обновляем таймер раз в минуту

    // Запускаем виджет ВК (группа 187395167)
    VK.Widgets.Group("vk_groups", {mode: 4, width: "auto", height: "500", color1: '1a1b26', color2: 'ffffff', color3: '38bdf8'}, 187395167);
</script>
</body>
</html>
