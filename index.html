    function formatTime(diffMinutes) {
        let h = Math.floor(diffMinutes / 60);
        let m = diffMinutes % 60;
        return (h > 0 ? h + " ч. " : "") + m + " мин.";
    }

    function render() {
        const now = new Date();
        let day = now.getDay();
        let currentWeek = 2; // Текущая неделя 2

        const daysNames = ["Воскресенье", "Понедельник", "Вторник", "Среда", "Четверг", "Пятница", "Суббота"];
        document.getElementById("infoBar").innerHTML = `<span>${daysNames[day]}</span> <span>Неделя ${currentWeek}</span>`;

        const container = document.getElementById("scheduleContainer");
        container.innerHTML = "";

        if (day === 0 || !scheduleData[currentWeek][day] || scheduleData[currentWeek][day].length === 0) {
            container.innerHTML = '<div class="card"><div class="subject">Пар нет! Отдыхаем 🎉</div></div>';
            return;
        }

        const lessons = scheduleData[currentWeek][day];
        const currentTimeMinutes = now.getHours() * 60 + now.getMinutes();

        lessons.forEach(l => {
            let [startStr, endStr] = l.time.split(" - ");
            let [sH, sM] = startStr.split(":").map(Number);
            let [eH, eM] = endStr.split(":").map(Number);
            let startMin = sH * 60 + sM;
            let endMin = eH * 60 + eM;

            let statusText = "Ожидается";
            let statusColor = "#94a3b8";
            let isActive = false;

            if (currentTimeMinutes >= startMin && currentTimeMinutes <= endMin) {
                isActive = true;
                let left = endMin - currentTimeMinutes;
                statusText = `До конца: ${left} мин.`;
                statusColor = "#22c55e";
            } else if (currentTimeMinutes > endMin) {
                statusText = "Завершена";
                statusColor = "#64748b";
            } else {
                let left = startMin - currentTimeMinutes;
                statusText = `До начала: ${left} мин.`;
                statusColor = "#f59e0b";
            }

            container.innerHTML += `
                <div class="card ${isActive ? 'active' : ''}">
                    <div class="header">
                        <span class="lesson-num">${l.num}</span>
                        <span class="cabinet">Каб. ${l.cabinet}</span>
                    </div>
                    <div class="subject">${l.subject}</div>
                    <div class="teacher">${l.teacher}</div>
                    <div class="footer">
                        <span class="time">${l.time}</span>
                        <span class="status" style="color: ${statusColor};">${statusText}</span>
                    </div>
                </div>
            `;
        });
    }

    render();
